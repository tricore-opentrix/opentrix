name: Task
description: A task with an assignee and deadline, normally completed within three days.
title: "[Area] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Title format: `[Area] Short description`. Add an assignee, a milestone and an `area:*` label after creating the Issue.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State what a user or reviewer will observe when this is complete.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Up to five verifiable items.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State what this issue will not cover.
  - type: input
    id: reviewer
    attributes:
      label: Proposed reviewer
      description: Someone other than the assignee (see the review table in CONTRIBUTING.md).
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues or PRs that must be done first, or "None".
  - type: input
    id: links
    attributes:
      label: Related links
      description: Link documents, ADRs, or other issues; keep long designs in docs/.
