name: Bug report
description: Report behavior that differs from what is expected.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** Follow [SECURITY.md](https://github.com/tricore-opentrix/opentrix/blob/main/SECURITY.md) and use private vulnerability reporting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Core backend
        - IT Helpdesk
        - Portal BFF
        - Frontend
        - Infrastructure / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include logs or screenshots, but no tokens, passwords, or real user data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A SHA on main, or a tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For example, OS, browser, Docker version.
