# Overlay: docker compose -f infra/compose.demo.yml -f infra/compose.gateway.yml ...
services:
  postgres:
    # The namespace owner publishes ports for every service sharing its network.
    ports:
      - "127.0.0.1:9080:9080"

  backend:
    ports: !reset []
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8180;
          printf 'GET /realms/tricore/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s

  portal-bff:
    environment:
      PORTAL_BACKEND_BASE_URL: http://127.0.0.1:9080

  apisix:
    image: apache/apisix:3.13.0-debian
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/tricore}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-tricore-api}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080;
          printf 'GET /api/v1/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
