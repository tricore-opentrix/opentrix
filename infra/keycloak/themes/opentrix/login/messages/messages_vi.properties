# Vietnamese (realm default locale "vi"). Keycloak renders <html lang="vi"> for this locale.
# Only visible login copy is overridden here; every other key falls back to Keycloak's own messages_vi,
# then messages_en.

# Brand panel. Keycloak renders this key inside #kc-header-wrapper through kcSanitize(), so it
# may only contain inert markup (div/span/p/ul/li + class). No scripts, links, forms or images.
loginTitleHtml=<div class="ot-brand"><span class="ot-brand-mark"></span><span class="ot-brand-text"><span class="ot-brand-name">OpenTrix</span><span class="ot-brand-product">IT Helpdesk</span></span><span class="ot-badge">integration-local</span></div><div class="ot-art"></div><div class="ot-story"><p class="ot-lead">Một nơi duy nhất cho hỗ trợ IT nội bộ.</p><ul class="ot-steps"><li>Gửi yêu cầu chỉ trong vài bước</li><li>Theo dõi tiến độ xử lý</li><li>Xác nhận khi sự cố đã được giải quyết</li></ul></div><p class="ot-note">Xác thực qua tài khoản tổ chức. OpenTrix không lưu mật khẩu của bạn.</p>
loginTitle=Đăng nhập {0}
loginAccountTitle=Đăng nhập IT Helpdesk
doLogIn=Đăng nhập
username=Tên đăng nhập
password=Mật khẩu
showPassword=Hiện mật khẩu
hidePassword=Ẩn mật khẩu

# Same meaning as the stock messages; deliberately does not reveal which field was wrong.
invalidUserMessage=Tên đăng nhập hoặc mật khẩu không đúng.
accountTemporarilyDisabledMessage=Tên đăng nhập hoặc mật khẩu không đúng.
accountDisabledMessage=Tài khoản đã bị vô hiệu hóa, hãy liên hệ quản trị viên.
